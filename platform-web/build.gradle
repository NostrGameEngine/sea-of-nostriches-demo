task copyAllResources {
    description = "Copy all resources to the TeaVM output directory"
    group = "build"

    // Ensure this project and every project dependency have their jars built
    dependsOn configurations.runtimeClasspath.getTaskDependencyFromProjectDependency(true, 'jar')
    dependsOn 'jar'

    // Keep existing TeaVM compilation prerequisites if they exist
    ['compileTeavmJava','processTeavmResources','compileJava','processResources']
        .each { tn -> if (tasks.findByName(tn) != null) dependsOn tn }

    doFirst {
        println "Copying ALL runtimeClasspath resources (including transitives) -> $buildDir/generated/teavm/js"
        delete "$buildDir/generated/teavm/js"
    }

    doLast {
        def dest = file("$buildDir/generated/teavm/js")
        dest.mkdirs()

        def safeCopy = { spec ->
            copy {
                into dest
                from spec
                exclude(*binaryExclusions)
                // Also skip obvious non-resource build metadata if desired:
                exclude '**/module-info.class'
                includeEmptyDirs = false
                duplicatesStrategy = DuplicatesStrategy.INCLUDE
            }
        }

        // 1. This module's own resources
        safeCopy('src/main/resources')

        // 2. All resolved runtimeClasspath entries (transitive)
        //    This includes external jars, project jars, and output dirs.
        def runtimeFiles = configurations.runtimeClasspath.resolvedConfiguration.lenientConfiguration.files
        runtimeFiles.each { f ->
            if (!f.exists()) return
            if (f.isDirectory()) {
                safeCopy(f)
            } else if (f.name.endsWith('.jar')) {
                safeCopy(project.zipTree(f))
            }
        }

        println "Resource aggregation complete. Total files: " +
            fileTree(dest).matching { exclude(*binaryExclusions) }.files.size()
    }
}



task finalizeResources {
    dependsOn copyAllResources
    group = "build"
 
     

    doLast {
        def manifestFile = file("$buildDir/generated/teavm/js/manifest.json")
        if (manifestFile.exists()) {
            def manifest = new groovy.json.JsonSlurper().parseText(manifestFile.text)
            manifest.name = appFullName
            manifest.short_name = appName

            manifestFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest))
            println "Updated manifest.json: name=$appFullName, short_name=$appName"
        }
      

      
    }
}

 

task generateResourcesIndex {
    dependsOn finalizeResources

    doLast {
        def outputDir = file("$buildDir/generated/teavm/js/")
        def outputFile = file("$buildDir/generated/teavm/js/resources.index.txt")

        outputFile.text = generateHashes(outputDir)
    }
}

def generateHashes(File dir) {
    def hashes = []
    Files.walk(Paths.get(dir.toURI())).filter { 
        Files.isRegularFile(it) 
    }.forEach { file ->
        def relativePath = dir.toPath().relativize(file).toString()
        if(relativePath.endsWith(".class")) return;
        if(relativePath.endsWith(".java")) return;
        def hash = generateSHA256(file.toFile())
        def size = file.toFile().length()
        hashes << "$hash $size $relativePath"
    }
    return hashes.join('\n')
}

def generateSHA256(file) {
    def messageDigest = MessageDigest.getInstance("SHA-256")
    file.eachByte(4096) { bytes, len ->
        messageDigest.update(bytes, 0, len)
    }
    return messageDigest.digest().collect { String.format("%02x", it) }.join()
}


